<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit movie</title>
    <link type="text/css" rel="stylesheet" href="/css/bootstrap.min.css" th:href="@{/css/bootstrap.min.css}" />
</head>

<body>

    <h1>Edit movie</h1>

    <form th:object="${movie}" th:action="@{/save}" method="post">

        <input type="hidden" th:field="*{id}">

        <label>Title:</label>
        <input type="text" th:field="*{title}">
        <span th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></span>

        <label>Director:</label>
        <input type="text" th:field="*{director}">
        <span th:if="${#fields.hasErrors('director')}" th:errors="*{director}"></span>

        <label>Release year:</label>
        <input type="number" th:field="*{releaseYear}">
        <span th:if="${#fields.hasErrors('releaseYear')}" th:errors="*{releaseYear}"></span>

        <label>Watched date:</label>
        <input type="date" th:field="*{watchedDate}">
        <span th:if="${#fields.hasErrors('watchedDate')}" th:errors="*{watchedDate}"></span>

        <label>Rating 0-5:</label>
        <input type="number" th:field="*{rating}" min="0" max="5">
        <span th:if="${#fields.hasErrors('rating')}" th:errors="*{rating}"></span>

        <label>Genre:</label>

        <select th:field="*{genre}">
            <option th:each="genre : ${genres}" th:value="${genre.id}" th:text="${genre.name}">
            </option>
        </select>
        <span th:if="${#fields.hasErrors('genre')}" th:errors="*{genre}"></span>

        <label>Review:</label>
        <textarea th:field="*{review}"></textarea>

        <input type="submit" value="Save">
    </form>

</body>

</html>
